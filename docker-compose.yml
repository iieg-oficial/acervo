name: acervo

services:
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.23}
    container_name: acervo-seaweedfs
    user: "seaweed:seaweed"
    entrypoint: ["/bin/sh", "/seaweedfs-entrypoint.sh"]
    command:
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/identities.json
      - -s3.port=8333
      - -metricsPort=9091
      - -ip=acervo-seaweedfs
    ports:
      - "${ACERVO_S3_PORT:-8333}:8333"
    environment:
      WEED_LEVELDB2_ENABLED: "true"
    volumes:
      - seaweedfs_data:/data
      - ./config:/etc/seaweedfs:ro
      - ./scripts/seaweedfs-entrypoint.sh:/seaweedfs-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://acervo-seaweedfs:9333/cluster/status | grep -q IsLeader"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - acervo_network
      - iieg-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  acervo-init:
    profiles: ["init"]
    image: alpine:3.20
    container_name: acervo-init
    entrypoint: ["/bin/sh", "/scripts/init-seaweedfs.sh"]
    volumes:
      - ./scripts/init-seaweedfs.sh:/scripts/init-seaweedfs.sh:ro
      - ./config:/etc/seaweedfs
    environment:
      ACERVO_BUCKETS: "${ACERVO_BUCKETS:?ACERVO_BUCKETS is required}"
      ACERVO_PUBLIC_BUCKETS: "${ACERVO_PUBLIC_BUCKETS:-portal mapalab iieg}"
      ACERVO_ADMIN_ACCESS_KEY: "${ACERVO_ADMIN_ACCESS_KEY:?ACERVO_ADMIN_ACCESS_KEY is required}"
      ACERVO_ADMIN_SECRET_KEY: "${ACERVO_ADMIN_SECRET_KEY:?ACERVO_ADMIN_SECRET_KEY is required}"
      ROTATE_FLAG: "${ROTATE_FLAG:-0}"
      TARGET_BUCKET: "${TARGET_BUCKET:-}"
    restart: "no"

volumes:
  seaweedfs_data:

networks:
  acervo_network:
    driver: bridge
  iieg-network:
    external: true

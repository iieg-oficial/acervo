name: acervo

services:
  nginx:
    image: nginx:alpine
    container_name: acervo-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/acervo.conf:/etc/nginx/conf.d/acervo.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    environment:
      CONSOLE_ALLOWED_IPS: ${CONSOLE_ALLOWED_IPS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    entrypoint: ["/docker-entrypoint.d/nginx-entrypoint.sh"]
    configs:
      - source: nginx_entrypoint
        target: /docker-entrypoint.d/nginx-entrypoint.sh
        mode: 0755
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - acervo_public
      - acervo_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d/dynamic:mode=755
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  minio:
    image: minio/minio:latest
    container_name: acervo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}
    volumes:
      - minio_data:/data
      - ./nginx/ssl/acervo.crt:/root/.minio/certs/CAs/acervo.crt:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - acervo_internal
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  acervo-init:
    profiles: ["init"]
    image: minio/mc
    container_name: acervo-init
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    volumes:
      - ./scripts/init-buckets.sh:/scripts/init-buckets.sh:ro
      - ./nginx/ssl/acervo.crt:/etc/ssl/certs/acervo.crt:ro
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    tmpfs:
      - /root/.mc
      - /tmp
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - acervo_internal
    restart: "no"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

configs:
  nginx_entrypoint:
    file: ./scripts/nginx-entrypoint.sh

volumes:
  minio_data:

networks:
  acervo_internal:
    driver: bridge
    internal: true
  acervo_public:
    driver: bridge

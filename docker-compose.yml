name: acervo

services:
  nginx:
    image: nginx:alpine
    container_name: acervo-nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - acervo_network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: acervo-minio
    command: server /data --console-address ":9001"
    extra_hosts:
      - "${S3_DOMAIN}:host-gateway"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}
    volumes:
      - minio_data:/data
      - ./nginx/ssl/${S3_DOMAIN}.crt:/root/.minio/certs/CAs/${S3_DOMAIN}.crt:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - acervo_network
    restart: unless-stopped

volumes:
  minio_data:

networks:
  acervo_network:
    driver: bridge

name: acervo

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3

services:
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:?}
    container_name: acervo-seaweedfs
    user: "seaweed:seaweed"
    entrypoint: ["/bin/sh", "/seaweedfs-entrypoint.sh"]
    command:
      - -dir=/data
      - -s3
      - -s3.config=/etc/seaweedfs/identities.json
      - -s3.port=8333
      - -metricsPort=9091
      - -ip.bind=0.0.0.0
      - -volume.max=100
    ports:
      - "${ACERVO_S3_BIND_ADDR:?}:${ACERVO_S3_PORT:?}:8333"
    environment:
      WEED_LEVELDB2_ENABLED: "true"
    volumes:
      - seaweedfs_data:/data
      - ./config:/etc/seaweedfs:ro
      - ./scripts/seaweedfs-entrypoint.sh:/seaweedfs-entrypoint.sh:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:9333/cluster/status | grep -q IsLeader"]
      timeout: 20s
      start_period: 30s
    networks:
      - acervo_network
      - iieg-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  version-api:
    build: ./version-api
    container_name: acervo-version-api
    restart: unless-stopped
    environment:
      ONTOY_SERVICE: acervo
      ONTOY_COMPOSE_PROJECT: acervo
      ONTOY_DISK_PATH: ${ONTOY_DISK_PATH:?}
    volumes:
      - ./VERSION:/app/VERSION:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/ontoy').read()"]
    networks:
      - iieg-network
    logging: *logging

  acervo-init:
    profiles: ["init"]
    image: alpine:3.20
    container_name: acervo-init
    entrypoint: ["/bin/sh", "/scripts/init-seaweedfs.sh"]
    volumes:
      - ./scripts/init-seaweedfs.sh:/scripts/init-seaweedfs.sh:ro
      - ./config:/etc/seaweedfs
    environment:
      ACERVO_BUCKETS: "${ACERVO_BUCKETS:?}"
      ACERVO_PUBLIC_BUCKETS: "${ACERVO_PUBLIC_BUCKETS:?}"
      ACERVO_ADMIN_ACCESS_KEY: "${ACERVO_ADMIN_ACCESS_KEY:?}"
      ACERVO_ADMIN_SECRET_KEY: "${ACERVO_ADMIN_SECRET_KEY:?}"
      ROTATE_FLAG: "${ROTATE_FLAG?}"
      TARGET_BUCKET: "${TARGET_BUCKET?}"
    restart: "no"
    logging: *logging

volumes:
  seaweedfs_data:

networks:
  acervo_network:
    driver: bridge
  iieg-network:
    external: true
